services:

  web:

    image: ghcr.io/kamran3515/job-board-api:latest

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      "

    volumes:
      - ./app/media:/app/media
      - ./logs:/app/logs
      - /var/www/Job-Board-API/app/staticfiles:/app/staticfiles

    restart: always

    env_file:
      - .env

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)\""
        ]

      interval: 30s

      timeout: 10s

      retries: 3

    depends_on:
      db:
        condition: service_healthy

  db:

    image: postgres:17-alpine

    container_name: postgres-prod

    restart: always

    volumes:
      - postgres_data:/var/lib/postgresql/data

    env_file:
      - .env

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

  nginx:

    image: nginx:latest

    restart: always

    container_name: nginx-prod

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

      - ./app/staticfiles:/app/staticfiles

      - ./app/media:/app/media

      - ./certbot/conf:/etc/letsencrypt

      - ./certbot/www:/var/www/certbot

    depends_on:
      - web

volumes:

  postgres_data:
