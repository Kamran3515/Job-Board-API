services:

  web:

    build: .

    container_name: django-api-prod

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      "

    volumes:
      - ./app/media:/app/media
      - ./logs:/app/logs

    restart: always

    env_file:
      - .env

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000')\""
        ]

      interval: 30s

      timeout: 10s

      retries: 3

    depends_on:
      db:
        condition: service_healthy

  db:

    image: postgres:17

    container_name: postgres-prod

    restart: always

    volumes:
      - postgres_data:/var/lib/postgresql/data

    env_file:
      - .env

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

  nginx:

    image: nginx:latest

    restart: always

    container_name: nginx-prod

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

      - ./app/staticfiles:/app/staticfiles

      - ./app/media:/app/media

    depends_on:
      - web

volumes:

  postgres_data: