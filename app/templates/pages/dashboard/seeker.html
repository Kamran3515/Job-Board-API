{% extends "pages/base.html" %} {% load static %} {% block title %} My
Applications {% endblock %} {% block content %}

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>My Applications</h1>
    <span id="application-count" class="badge bg-primary fs-6"> 0 </span>
  </div>
  <div id="dashboard-stats"></div>
  <div class="row mt-4">
    <div class="col-lg-12 mb-4">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-bold">📄 Recent Applications</div>

        <div id="recent-applications" class="list-group list-group-flush">
          <div class="list-group-item text-center text-muted py-4">
            No applications yet.
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="applications-container" class="row">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  </div>
</div>

{% endblock %} {% block extra_js %}

<script type="module" src="{% static 'js/pages/seekerDashboard.js' %}"></script>

{% endblock %}
