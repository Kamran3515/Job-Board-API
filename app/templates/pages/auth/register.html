{% extends "pages/base.html" %}
{% load static %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5">

        <div class="card shadow border-0 rounded-4">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <div class="login-logo">

                        💼

                    </div>

                    <h2 class="fw-bold">

                        Create Account

                    </h2>

                    <p>

                        Join our Job Board today

                    </p>

                </div>

                <form id="register-form" novalidate>

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            id="username"
                            class="form-control form-control-lg"
                            placeholder="Choose a username"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            id="email"
                            type="email"
                            class="form-control form-control-lg"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <div class="input-group input-group-lg">

                            <input
                                id="password"
                                type="password"
                                class="form-control form-control-lg"
                                placeholder="Password"
                                required
                            >

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="toggle-password"
                            >

                                👁

                            </button>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Confirm Password

                        </label>

                        <div class="input-group input-group-lg">

                            <input
                                id="confirm-password"
                                type="password"
                                class="form-control form-control-lg"
                                placeholder="Confirm Your Password"
                                required
                            >

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="toggle-confirm-password"
                            >

                                👁

                            </button>

                        </div>

                    </div>

                    <label class="form-label fw-semibold mb-3">
                        Register As
                    </label>

                    <div class="row g-3 mb-4">

                        <div class="col-6">

                            <input
                                class="btn-check"
                                type="radio"
                                name="role"
                                id="employer"
                                value="EMPLOYER"
                                checked
                            >

                            <label
                                class="btn btn-outline-primary w-100 p-3 rounded-4"
                                for="employer"
                            >

                                <strong>Employer</strong>

                                <br>

                                <small>
                                    Post Jobs
                                </small>

                            </label>

                        </div>

                        <div class="col-6">

                            <input
                                class="btn-check"
                                type="radio"
                                name="role"
                                id="job-seeker"
                                value="JOB_SEEKER"
                            >

                            <label
                                class="btn btn-outline-success w-100 p-3 rounded-4"
                                for="job-seeker"
                            >

                                <strong>Job Seeker</strong>

                                <br>

                                <small>
                                    Apply Jobs
                                </small>

                            </label>

                        </div>

                    </div>

                    <button
                        id="register-btn"
                        class="btn btn-primary btn-lg w-100"
                        type="submit"
                    >

                        Register

                    </button>

                </form>

                <hr class="my-4">

                <p class="text-center mb-0">

                    Already have an account?

                    <a
                        href="/login/"
                        class="fw-semibold text-decoration-none">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}

<script
type="module"
src="{% static 'js/pages/register.js' %}">
</script>

{% endblock %}
