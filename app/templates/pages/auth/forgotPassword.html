{% extends "pages/base.html" %}
{% load static %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="mb-4 text-center">

                        Forgot Password

                    </h3>

                    <form id="forgot-password-form">

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                id="email"
                                type="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            class="btn btn-primary w-100"
                        >

                            Send Reset Link

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}

<script
type="module"
src="{% static 'js/pages/forgotPassword.js' %}">
</script>

{% endblock %}
