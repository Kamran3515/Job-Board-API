{% extends "pages/base.html" %}
{% load static %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="text-center mb-4">

                        Reset Password

                    </h3>

                    <form id="reset-password-form">

                        <div class="mb-3">

                            <label class="form-label">

                                New Password

                            </label>

                            <input
                                id="password"
                                type="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <input
                                id="confirm_password"
                                type="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            class="btn btn-primary w-100">

                            Change Password

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}

<script
type="module"
src="{% static 'js/pages/resetPassword.js' %}">
</script>

{% endblock %}
