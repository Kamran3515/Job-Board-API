<div
    class="modal fade"
    id="applyModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Apply for this Job

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="apply-form">

                    <div class="mb-3">

                        <label class="form-label">

                            Cover Letter

                        </label>

                        <textarea

                            id="cover-letter"
                            class="form-control"
                            rows="5"
                            placeholder="Tell the employer why you are a good fit..."
                            required
                        ></textarea>

                    </div>

                    <button

                        id="submit-application-btn"

                        class="btn btn-success w-100">

                        Submit Application

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
