<div class="modal fade" id="companyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Company</h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <div class="modal-body">
        <form id="company-form">
          <div class="mb-3">
            <label>Name</label>

            <input id="company-name" class="form-control" required />
          </div>

          <div class="mb-3">
            <label>Description</label>

            <textarea id="company-description" class="form-control" required ></textarea>
          </div>

          <div class="mb-3">
            <label>Website</label>

            <input id="company-website" class="form-control" required />
          </div>

          <div class="mb-3">
            <label>Location</label>

            <input id="company-location" class="form-control" required />
          </div>

          <button id="create-company-btn" class="btn btn-primary w-100">Create Company</button>
        </form>
      </div>
    </div>
  </div>
</div>
