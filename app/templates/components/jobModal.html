<div class="modal fade" id="jobModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">

                <h5 class="modal-title" id="job-modal-title">
                  Create Job
                </h5>

                <button class="btn-close" data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <form id="job-form">

                    <!-- Company -->

                    <div class="mb-3">

                        <label class="form-label">

                            Company

                        </label>

                        <select
                            id="company"
                            class="form-select"
                            required>

                        </select>

                    </div>

                    <!-- Title -->

                    <div class="mb-3">

                        <label class="form-label">

                            Title

                        </label>

                        <input
                            id="title"
                            class="form-control"
                            required>

                    </div>

                    <!-- Description -->

                    <div class="mb-3">

                        <label class="form-label">

                            Description

                        </label>

                        <textarea
                            id="description"
                            rows="4"
                            class="form-control"
                            required></textarea>

                    </div>

                    <!-- Requirements -->

                    <div class="mb-3">

                        <label class="form-label">

                            Requirements

                        </label>

                        <textarea
                            id="requirements"
                            rows="4"
                            class="form-control"
                            required></textarea>

                    </div>

                    <!-- Location -->

                    <div class="mb-3">

                        <label class="form-label">

                            Location

                        </label>

                        <input
                            id="location"
                            class="form-control"
                            placeholder="Tehran"
                            required>

                    </div>

                    <!-- Work Mode / Job Type -->

                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">

                                Work Mode

                            </label>

                            <select
                                id="work_mode"
                                class="form-select">

                                <option value="ONSITE">
                                    On Site
                                </option>

                                <option value="HYBRID">
                                    Hybrid
                                </option>

                                <option value="REMOTE">
                                    Remote
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Job Type

                            </label>

                            <select
                                id="job_type"
                                class="form-select">

                                <option value="FULL_TIME">
                                    Full Time
                                </option>

                                <option value="PART_TIME">
                                    Part Time
                                </option>

                                <option value="CONTRACT">
                                    Contract
                                </option>

                                <option value="INTERNSHIP">
                                    Internship
                                </option>

                                <option value="FREELANCE">
                                    Freelance
                                </option>

                                <option value="TEMPORARY">
                                    Temporary
                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- Experience -->

                    <div class="mt-3">

                        <label class="form-label">

                            Experience Level

                        </label>

                        <select
                            id="experience_level"
                            class="form-select">

                            <option value="INTERN">
                                Intern
                            </option>

                            <option value="JUNIOR">
                                Junior
                            </option>

                            <option value="MID">
                                Mid
                            </option>

                            <option value="SENIOR">
                                Senior
                            </option>

                            <option value="LEAD">
                                Lead
                            </option>

                        </select>

                    </div>

                    <!-- Salary -->

                    <div class="row mt-3">

                        <div class="col">

                            <input
                                id="salary_min"
                                type="number"
                                class="form-control"
                                placeholder="Minimum Salary">

                        </div>

                        <div class="col">

                            <input
                                id="salary_max"
                                type="number"
                                class="form-control"
                                placeholder="Maximum Salary">

                        </div>

                    </div>

                    <!-- Skills -->

                    <div class="mt-4">

                        <label class="form-label">

                            Skills

                        </label>

                        <input
                            id="skills-search"
                            type="text"
                            class="form-control mb-3"
                            placeholder="Search skills...">

                        <div
                            id="skills-list"
                            class="border rounded p-3"
                            style="max-height:250px;overflow-y:auto;">

                        </div>

                    </div>

                    <!-- Expire -->

                    <div class="mt-4">

                        <label class="form-label">

                            Active For

                        </label>

                        <select
                            id="expire_days"
                            class="form-select">

                            <option value="30">
                                30 Days
                            </option>

                            <option value="60">
                                60 Days
                            </option>

                            <option value="90">
                                90 Days
                            </option>

                        </select>

                    </div>

                    <button
                        id="job-submit-btn"
                        class="btn btn-primary w-100 mt-4">

                        Save Job

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
